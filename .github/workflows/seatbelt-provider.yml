name: Seatbelt provider

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/seatbelt-provider.yml"
      - "agently/builtins/plugins/ExecutionResourceProvider/SeatbeltExecutionResourceProvider.py"
      - "agently/core/operation/Action/ActionResourceRegistrar.py"
      - "tests/test_seatbelt_bugs.py"
      - "tests/test_seatbelt_execution_provider_integration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seatbelt-mechanism:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Agently test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio

      - name: Verify sandbox-exec is available
        run: test -x /usr/bin/sandbox-exec

      - name: Run deterministic and observed Seatbelt tests
        run: |
          python -W error::RuntimeWarning -m pytest tests/test_seatbelt_bugs.py -q
          python -m pytest tests/test_seatbelt_execution_provider_integration.py -q -rs
