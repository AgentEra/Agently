name: Bubblewrap provider

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/bubblewrap-provider.yml"
      - "agently/builtins/plugins/ExecutionResourceProvider/BubblewrapExecutionResourceProvider.py"
      - "agently/core/operation/Action/ActionResourceRegistrar.py"
      - "tests/test_bubblewrap_isolation.py"
      - "tests/test_bubblewrap_execution_provider_integration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bubblewrap-mechanism:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Bubblewrap without weakening host policy
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      - name: Install Agently test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio

      - name: Run deterministic and observed Bubblewrap tests
        run: |
          python -W error::RuntimeWarning -m pytest tests/test_bubblewrap_isolation.py -q
          python -m pytest tests/test_bubblewrap_execution_provider_integration.py -q -rs
