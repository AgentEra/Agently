name: Publish on version change

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    name: Validate Python ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Install locked dependencies
        run: poetry install --all-extras
      - name: Install release validation tools
        run: >-
          poetry run python -m pip install pyright "fastmcp>=3,<4" python-dotenv
          beautifulsoup4 "fastapi>=0.104" sqlmodel aiosqlite
      - name: Verify Stage and compatibility contracts
        run: poetry run pytest -q tests/test_stage_support_contract.py tests/test_compatibility_registry.py
      - name: Type check
        if: matrix.python-version == '3.10'
        run: >-
          poetry run pyright --pythonpath "$(poetry env info --executable)"
          tests/test_stage_support_contract.py
          tests/test_compatibility_registry.py
      - name: Run full test suite
        run: poetry run pytest -q

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version change
        id: version_check
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          
          def read_version_from_text(text: str) -> str:
              data = tomllib.loads(text)
              project = data.get("project", {})
              if "version" in project:
                  return project["version"]
              tool_poetry = data.get("tool", {}).get("poetry", {})
              return tool_poetry["version"]
          
          with open("pyproject.toml", "rb") as f:
              current = read_version_from_text(f.read().decode("utf-8"))
          
          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          if not before or before == "0000000000000000000000000000000000000000":
              print("publish=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              sys.exit(0)
          
          try:
              previous_text = subprocess.check_output(
                  ["git", "show", f"{before}:pyproject.toml"],
                  text=True,
              )
              previous = read_version_from_text(previous_text)
          except Exception:
              print("publish=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              sys.exit(0)
          
          publish = "true" if current != previous else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"publish={publish}", file=f)
          PY
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - name: Install Poetry
        if: steps.version_check.outputs.publish == 'true'
        run: pipx install poetry
      - name: Publish
        if: steps.version_check.outputs.publish == 'true'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --build
