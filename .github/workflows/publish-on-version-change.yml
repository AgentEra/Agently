name: Publish on version change

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the current version after a failed validated release"
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        fastmcp-version: ["3", "4"]
    name: Validate Python ${{ matrix.python-version }} / FastMCP ${{ matrix.fastmcp-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Install locked dependencies
        run: poetry install --all-extras
      - name: Install release validation tools
        run: >-
          poetry run python -m pip install pyright "fastmcp>=${{ matrix.fastmcp-version }},<${{ matrix.fastmcp-version == '3' && '4' || '5' }}" python-dotenv
          beautifulsoup4 "fastapi>=0.104" sqlmodel aiosqlite "ruff==0.16.5"
        # Optional packages are needed to inspect the complete public typing surface,
        # not to import or run a minimal installed Agently application.
      - name: Install optional typing dependencies
        if: matrix.python-version == '3.10'
        run: poetry run python -m pip install "playwright==1.62.0" "chromadb==1.5.9"
      - name: Verify Stage and compatibility contracts
        run: poetry run pytest -q tests/test_stage_support_contract.py tests/test_compatibility_registry.py
      - name: Lint complete Python surface
        if: matrix.python-version == '3.10'
        run: poetry run ruff check --force-exclude agently tests examples scripts
      - name: Type check
        if: matrix.python-version == '3.10'
        run: >-
          poetry run pyright --pythonpath "$(poetry env info --executable)"
          agently tests examples scripts
      - name: Reject unexpected runtime warnings in 4.1.4.8 quality paths
        run: >-
          poetry run pytest -q -W error::RuntimeWarning
          tests/test_programmatic_action_contracts.py
          tests/test_programmatic_action_runtime.py
          tests/test_programmatic_action_integration_review.py
          tests/test_programmatic_action_docker_e2e.py
          tests/test_code_execution_host_async_bindings.py
          tests/test_model_output_observation_policy.py
          tests/test_playwright_e2e_examples.py
          tests/test_utils/test_settings.py
          tests/test_compatibility_registry.py
          tests/test_changed_python_quality.py
      - name: Run full test suite
        run: poetry run pytest -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install declared minimum typing dependencies
        run: python -m pip install . "pydantic==2.11.7" "typing_extensions==4.12.2" "anyio==4.8.0" "pytest==8.4.2" "pytest-asyncio==1.4.0"
      - name: Verify startup and annotated snapshot contracts
        run: |
          cd "${RUNNER_TEMP}"
          python -c 'from typing import Annotated; from pydantic import Field; from agently import Agently; from agently.builtins.plugins.AgentExecution.modules.snapshot import _contract_value; Agently.create_agent(); assert _contract_value(Annotated[str, Field(min_length=2)])["annotation_schema"]["minLength"] == 2'
          cd "${GITHUB_WORKSPACE}"
          python -m pytest -q tests/test_agent_execution_snapshot_typed.py

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, minimum-dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version change
        id: version_check
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          
          def read_version_from_text(text: str) -> str:
              data = tomllib.loads(text)
              project = data.get("project", {})
              if "version" in project:
                  return project["version"]
              tool_poetry = data.get("tool", {}).get("poetry", {})
              return tool_poetry["version"]
          
          with open("pyproject.toml", "rb") as f:
              current = read_version_from_text(f.read().decode("utf-8"))
          
          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          force_publish = os.environ.get("FORCE_PUBLISH", "").strip().lower() == "true"
          if event_name == "workflow_dispatch":
              publish = "true" if force_publish else "false"
          elif not before or before == "0000000000000000000000000000000000000000":
              publish = "true"
          else:
              try:
                  previous_text = subprocess.check_output(
                      ["git", "show", f"{before}:pyproject.toml"],
                      text=True,
                  )
                  previous = read_version_from_text(previous_text)
              except Exception:
                  publish = "true"
              else:
                  publish = "true" if current != previous else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"publish={publish}", file=f)
          PY
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || 'false' }}
      - name: Install Poetry
        if: steps.version_check.outputs.publish == 'true'
        run: pipx install poetry
      - name: Publish
        if: steps.version_check.outputs.publish == 'true'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --build
